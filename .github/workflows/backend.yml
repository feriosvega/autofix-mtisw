# Pipeline de entrega continua del BACKEND:
#   1) obtiene el código desde GitHub  2) ejecuta las pruebas unitarias (JUnit + JaCoCo >= 90% en servicios)
#   3) genera el .jar  4) construye la imagen Docker  5) la publica en Docker Hub
# El despliegue en el servidor cloud se hace manualmente con Docker Compose (deployment/).
name: Backend CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - "autofix-backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autofix-backend

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Ejecutar pruebas unitarias y verificar cobertura (JaCoCo)
        run: |
          chmod +x mvnw
          ./mvnw -B clean test

      - name: Publicar reporte de cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: autofix-backend/target/site/jacoco

      - name: Generar el .jar
        run: ./mvnw -B package -DskipTests

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: autofix-backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/autofix-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/autofix-backend:${{ github.sha }}

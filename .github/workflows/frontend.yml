# Pipeline de entrega continua del FRONTEND:
#   1) obtiene el código desde GitHub  2) instala dependencias y genera el build (dist)
#   3) construye la imagen Docker (Nginx + dist)  4) la publica en Docker Hub
name: Frontend CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - "autofix-frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autofix-frontend

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: autofix-frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar build de producción (dist)
        run: npm run build

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: autofix-frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/autofix-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/autofix-frontend:${{ github.sha }}

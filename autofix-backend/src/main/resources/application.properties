server.port=8090
spring.application.name=autofix-backend

# Base de datos (PostgreSQL). Los valores se inyectan por variables de entorno (Docker Compose / IntelliJ).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:autofix}
spring.datasource.username=${DB_USERNAME:autofix}
spring.datasource.password=${DB_PASSWORD:autofix}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Keycloak (IAM). El backend es un "Resource Server": solo valida los JWT firmados por Keycloak.
# jwk-set-uri: de donde descarga las llaves públicas (red interna de Docker).
# issuer-uri: valida que el claim "iss" del token corresponda al realm de AutoFix.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:9090/auth/realms/autofix-realm/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost/auth/realms/autofix-realm}

# Swagger UI: http://localhost:8090/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui.html

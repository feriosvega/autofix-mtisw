server:
  port: 8080
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
spring:
  cloud:
    gateway:
      # El frontend (otro origen: otro puerto) llama al gateway desde el navegador
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: '*'
            allowed-methods: '*'
            allowed-headers: '*'
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      # Rutas: lb:// = el gateway resuelve la instancia del microservicio a través de Eureka
      routes:
        - id: vehicle-service
          uri: lb://vehicle-service
          predicates:
            - Path=/api/v1/vehicles/**
        - id: repair-list-service
          uri: lb://repair-list-service
          predicates:
            - Path=/api/v1/repair-types/**
        - id: repair-service
          uri: lb://repair-service
          predicates:
            - Path=/api/v1/repairs/**, /api/v1/bonuses/**
        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/api/v1/reports/**

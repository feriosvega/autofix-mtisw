apiVersion: v1
kind: ConfigMap
metadata:
  name: autofix-config
  namespace: autofix
data:
  CONFIG_GIT_URI: https://github.com/feriosvega/autofix-mtisw
  CONFIG_GIT_LABEL: eval2
  CONFIG_GIT_PATH: autofix-microservices/config-data
  CONFIG_SERVER_URL: http://config-service:8081
  EUREKA_URL: http://eureka-service:8761/eureka
  EUREKA_HOSTNAME: eureka-service
  GATEWAY_NODE_PORT: "30080"
  # Memoria acotada: 7 JVM deben caber en minikube
  JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC -Xss512k"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: microservice-port-proxy
  namespace: autofix
data:
  proxy.conf.template: |
    server {
      listen 8080;
      location / {
        proxy_pass http://127.0.0.1:${APP_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
    }

apiVersion: v1
kind: Service
metadata:
  name: config-service
  namespace: autofix
spec:
  selector: { app: config-service }
  ports:
    - { name: http, port: 8081, targetPort: 8081 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-service
  namespace: autofix
spec:
  replicas: 1
  selector:
    matchLabels: { app: config-service }
  template:
    metadata:
      labels: { app: config-service }
    spec:
      initContainers:
        # Espera a que el DNS resuelva GitHub: el Config Server clona config-data al iniciar
        - name: wait-for-dns
          image: busybox:1.36
          command: ["sh", "-c", "until nslookup github.com; do sleep 2; done"]
      containers:
        - name: config-service
          image: __DOCKERHUB_USER__/autofix-config-service:eval2
          ports:
            - { name: http, containerPort: 8081 }
          envFrom:
            - configMapRef: { name: autofix-config }
---

apiVersion: v1
kind: Service
metadata:
  name: vehicle-service
  namespace: autofix
spec:
  type: ClusterIP
  selector: { app: vehicle-service }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-service
  namespace: autofix
spec:
  replicas: 1
  selector:
    matchLabels: { app: vehicle-service }
  template:
    metadata:
      labels: { app: vehicle-service }
    spec:
      initContainers:
        - name: wait-for-services
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z config-service 8081; do sleep 2; done
              until nc -z eureka-service 8761; do sleep 2; done
              until nc -z postgres-vehicles 5432; do sleep 2; done
      containers:
        - name: vehicle-service
          image: __DOCKERHUB_USER__/autofix-vehicle-service:eval2
          envFrom:
            - configMapRef: { name: autofix-config }
          env:
            - name: PORT_FILE
              value: /var/run/autofix/port
            - name: DB_HOST
              value: postgres-vehicles
            - name: DB_NAME
              value: autofix_vehicles
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: autofix-db-secrets, key: DB_USERNAME }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: autofix-db-secrets, key: DB_PASSWORD }
          volumeMounts:
            - { name: port-info, mountPath: /var/run/autofix }
        - name: clusterip-proxy
          image: nginx:1.27-alpine
          command:
            - sh
            - -c
            - |
              until [ -s /var/run/autofix/port ]; do sleep 1; done
              export APP_PORT="$(cat /var/run/autofix/port)"
              envsubst '$APP_PORT' < /etc/autofix/proxy.conf.template > /etc/nginx/conf.d/default.conf
              exec nginx -g 'daemon off;'
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - { name: port-info, mountPath: /var/run/autofix, readOnly: true }
            - { name: proxy-template, mountPath: /etc/autofix, readOnly: true }
      volumes:
        - name: port-info
          emptyDir: {}
        - name: proxy-template
          configMap: { name: microservice-port-proxy }
---

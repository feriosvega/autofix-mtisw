apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: autofix
spec:
  type: NodePort
  selector: { app: frontend }
  ports:
    - { name: http, port: 80, targetPort: 80, nodePort: 30081 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: autofix
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      initContainers:
        # nginx valida al iniciar que exista el host gateway-service (proxy /api de docker compose)
        - name: wait-for-gateway
          image: busybox:1.36
          command: ["sh", "-c", "until nslookup gateway-service.autofix.svc.cluster.local; do sleep 2; done"]
      containers:
        - name: frontend
          image: __DOCKERHUB_USER__/autofix-frontend:eval2
          ports:
            - { name: http, containerPort: 80 }
          env:
            - name: GATEWAY_NODE_PORT
              valueFrom:
                configMapKeyRef: { name: autofix-config, key: GATEWAY_NODE_PORT }

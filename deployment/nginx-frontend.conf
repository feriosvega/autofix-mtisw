events {
    worker_connections  1024;
}

http {
    # Balanceo round-robin entre las 3 réplicas del frontend
    upstream frontend {
        server frontend1:80;
        server frontend2:80;
        server frontend3:80;
    }

    # Los tokens de Keycloak viajan en headers grandes
    proxy_buffer_size        128k;
    proxy_buffers            4 256k;
    proxy_busy_buffers_size  256k;

    server {
        listen 80;

        # SPA React (balanceada)
        location / {
            proxy_pass http://frontend;
        }

        # API REST -> balanceador del backend (mismo origen que el frontend: sin CORS)
        location /api/ {
            proxy_pass http://nginx-backend:8090;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Keycloak (login, tokens, consola de administración en /auth/admin)
        location /auth/ {
            proxy_pass http://keycloak:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
